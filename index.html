<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prato Leve</title>
<meta name="theme-color" content="#EEF3ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1510" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prato Leve">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: app de uma coluna (máx. 560px), cabeçalho fixo no topo, barra de abas fixa embaixo */
:root{
  --bg:#EEF3ED; --surface:#FFFFFF; --surface-2:#E2EBE1; --fg:#13221A; --muted:#56685C; --line:#D1DDD0;
  --couve:#1C7247; --on-couve:#FFFFFF; --couve-soft:#D3EADB;
  --manga:#DF9300; --manga-ink:#8A5A00; --manga-soft:#FCEBC4;
  --goiaba:#D2445F; --goiaba-soft:#FADBE1;
  --ok:#1C7247; --warn:#A86400; --bad:#B83A3A;
  --scrim:rgba(10,22,15,.45);
  --shadow:0 1px 0 rgba(19,34,26,.04),0 8px 22px -12px rgba(19,34,26,.25);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1510; --surface:#16211A; --surface-2:#1F2C24; --fg:#E5EFE8; --muted:#9AAEA1; --line:#2B3A31;
  --couve:#4FC48B; --on-couve:#06170E; --couve-soft:#1D3A2A;
  --manga:#F3B640; --manga-ink:#F3C76A; --manga-soft:#3A2D10;
  --goiaba:#F07C91; --goiaba-soft:#3C1E26;
  --ok:#4FC48B; --warn:#F3B640; --bad:#F08080;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 22px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1510; --surface:#16211A; --surface-2:#1F2C24; --fg:#E5EFE8; --muted:#9AAEA1; --line:#2B3A31;
  --couve:#4FC48B; --on-couve:#06170E; --couve-soft:#1D3A2A;
  --manga:#F3B640; --manga-ink:#F3C76A; --manga-soft:#3A2D10;
  --goiaba:#F07C91; --goiaba-soft:#3C1E26;
  --ok:#4FC48B; --warn:#F3B640; --bad:#F08080;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 22px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2.5px solid var(--manga);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.18rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.86rem}
.muted{color:var(--muted)}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}

/* Cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px}
.hdr-row{display:flex;align-items:center;gap:10px}
.hello{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.hdr-sub{color:var(--muted);font-size:.85rem}
.hdr-txt{flex:1;min-width:0}
.lv{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 10px;text-align:left;min-width:120px}
.lv-n{font-family:var(--f-num);font-size:.72rem;color:var(--manga-ink);font-weight:500}
.lv-name{font-weight:700;font-size:.82rem;white-space:nowrap}
.lv-bar{grid-column:1/-1;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.lv-bar i{display:block;height:100%;background:var(--manga);border-radius:99px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}

/* Abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative}
.tab .dot{position:absolute;top:7px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--goiaba);border:2px solid var(--surface)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;font-size:.72rem;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--couve)}
.tab.on svg{stroke-width:2.2}

main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pill{font-family:var(--f-num);font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.link{color:var(--couve);font-weight:600;font-size:.86rem;text-decoration:underline;text-underline-offset:3px}
.hint{font-size:.82rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 14px;font-weight:700;font-size:.92rem;min-height:42px}
.btn.primary{background:var(--couve);color:var(--on-couve)}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:var(--couve)}
.btn.sm{min-height:36px;padding:7px 11px;font-size:.84rem}
.btn.wide{width:100%}
.btn.warn{color:var(--bad);border-color:currentColor}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Navegação de dia */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav-l{font-family:var(--f-display);font-weight:700;font-size:1.05rem;text-transform:capitalize}
.daynav .icon-btn{font-size:1.6rem;line-height:1}

/* Missões */
.missions.perfect{background:linear-gradient(160deg,var(--manga-soft),var(--surface) 70%);border-color:var(--manga)}
.mission{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-top:1px dashed var(--line)}
.mission:first-of-type{border-top:0}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .2s,background .2s}
.check svg{width:16px;height:16px;stroke:var(--on-couve);stroke-width:3;fill:none}
.mission.done .check{background:var(--couve);border-color:var(--couve);transform:scale(1.05)}
.mission.done .mt{color:var(--muted)}
.mt{flex:1;font-weight:600}
.mhint{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.perfect-msg{margin-top:8px;font-weight:800;font-family:var(--f-display);color:var(--manga-ink)}
.mis-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.streak svg{width:20px;height:20px}
.shield{font-size:.8rem;color:var(--muted)}

/* Água */
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cup{aspect-ratio:3/4;max-width:100%;border-radius:8px;display:grid;place-items:end center;padding-bottom:4px}
.cup svg{width:100%;height:100%}
.cup .glass{fill:none;stroke:var(--line);stroke-width:2}
.cup .water{fill:transparent;transition:fill .2s}
.cup.full .water{fill:#5AA9E6}
.cup.full .glass{stroke:#5AA9E6}

/* Barras */
.meter{display:flex;flex-direction:column;gap:6px}
.meter + .meter{margin-top:12px}
.meter-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter-h b{font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--couve);transition:width .4s}
.bar.over i{background:var(--manga)}
.bar.prot i{background:var(--goiaba)}

/* Refeições */
.meals{display:flex;flex-direction:column;gap:8px}
.meal{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.meal.has{border-color:var(--couve)}
.meal-dot{width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.meal.has .meal-dot{border:0;background:var(--couve)}
.meal-dot svg{width:14px;height:14px;stroke:var(--on-couve);stroke-width:3;fill:none}
.meal-c{flex:1;min-width:0}
.meal-h{display:flex;justify-content:space-between;gap:8px}
.meal-n{font-weight:700}
.meal-k{font-family:var(--f-num);font-size:.8rem;color:var(--muted);white-space:nowrap}
.meal-b{font-size:.86rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

.tip{background:var(--couve);color:var(--on-couve);border-color:transparent}
.tip .eyebrow{color:inherit;opacity:.8}
.tip h3{margin:4px 0 6px}
.eyebrow{font-size:.8rem;font-weight:700;color:var(--muted)}
.couple{display:flex;gap:12px;align-items:center}
.couple .c-txt{flex:1;min-width:0}

/* Onboarding */
.onb .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:1rem;color:var(--fg)}
.inp:focus{border-color:var(--couve);outline:none}
textarea.inp{min-height:90px;font-family:var(--f-num);font-size:.75rem}

/* Folha (bottom sheet) */
.sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet-panel{background:var(--surface);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 8px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-8px;background:var(--surface);padding-block:6px;z-index:2}
.sub-h{font-size:.86rem;font-weight:800;color:var(--muted);margin:16px 0 8px}
.logged-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.logged-row .nm{flex:1;min-width:0}
.logged-row .nm small{display:block;color:var(--muted);font-size:.78rem}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
.qty span{min-width:34px;text-align:center}
.mini{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.mini:hover{background:var(--surface-2);color:var(--fg)}
.combo{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.combo-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:99px;padding:5px 10px;font-size:.84rem;background:var(--surface)}
button.chip:hover{border-color:var(--couve)}
.chip .sw{color:var(--couve);font-weight:800}
.chip.on{background:var(--couve);color:var(--on-couve);border-color:var(--couve)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.food-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 6px;border-top:1px solid var(--line);border-radius:10px}
button.food-row:hover{background:var(--surface-2)}
.food-row .em{font-size:1.3rem;width:30px;text-align:center;flex:none}
.food-row .nm{flex:1;min-width:0}
.food-row .nm small{display:block;color:var(--muted);font-size:.78rem}
.food-row .kc{text-align:right;white-space:nowrap}
.food-row .kc small{display:block;color:var(--muted);font-size:.72rem}
.food-row.cur{background:var(--couve-soft)}

/* Subabas */
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-weight:700;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.recipe .rc-h{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.recipe .rc-h .num{color:var(--couve);font-weight:500}
.recipe .rc-d{color:var(--muted);font-size:.9rem;margin-bottom:10px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--couve);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +"}
details[open] summary::after{content:" −"}
details ol{padding-left:20px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.keep{font-size:.84rem;background:var(--manga-soft);color:var(--fg);padding:8px 10px;border-radius:10px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:10px 0 0;padding:0;list-style:none}
.steps li{display:flex;gap:10px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--couve-soft);color:var(--couve);font-weight:800;font-size:.8rem;display:grid;place-items:center}

/* Mercado */
.mk-sec h3{margin-bottom:4px}
.mk-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 2px;border-top:1px solid var(--line)}
.mk-item .check{width:24px;height:24px}
.mk-item .check svg{width:13px;height:13px}
.mk-item.on .check{background:var(--couve);border-color:var(--couve)}
.mk-item.on .mk-n{text-decoration:line-through;color:var(--muted)}
.mk-n{flex:1;min-width:0}
.mk-q{font-family:var(--f-num);font-size:.8rem;color:var(--muted);text-align:right}
.progress-line{display:flex;align-items:center;gap:10px}
.progress-line .bar{flex:1}
.swap-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.swap-row .from{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--goiaba)}
.swap-row .arr{color:var(--couve);font-weight:800}
.inline-form{display:flex;gap:8px;margin-top:10px}
.inline-form .inp{flex:1}

/* Corpo */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em}
.stat .v small{font-family:var(--f-body);font-size:.8rem;font-weight:600;color:var(--muted);margin-left:2px}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:600}
.status{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px}
.status.ok{background:var(--couve-soft);color:var(--ok)}
.status.warn{background:var(--manga-soft);color:var(--warn)}
.status.bad{background:var(--goiaba-soft);color:var(--bad)}
.delta{font-size:.78rem;font-weight:700;color:var(--ok)}
.delta.up{color:var(--warn)}
.sil-wrap{display:flex;justify-content:center}
.sil{width:100%;max-width:340px;height:auto}
.sil .now{fill:var(--couve-soft);stroke:var(--couve);stroke-width:2}
.sil .start{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 4}
.sil .goal{fill:none;stroke:var(--manga);stroke-width:2;stroke-dasharray:7 5}
.sil .lbl{font-family:var(--f-body);font-size:11px;fill:var(--muted);font-weight:600}
.sil .lbl.n{fill:var(--couve);font-weight:800}
.sil .lbl.g{fill:var(--manga-ink);font-weight:700}
.sil .lead{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:0;border-top:2px solid}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{opacity:.14}
.chart .goal{stroke:var(--manga);stroke-dasharray:5 4;stroke-width:1.5}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}
.hist-row .d{width:56px;font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.hist-row .vals{flex:1;min-width:0}
.wins{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.win{display:flex;gap:10px;align-items:center;background:var(--manga-soft);border-radius:12px;padding:8px 10px}
.win span{flex:1;min-width:0}
.win small{color:var(--muted);font-family:var(--f-num);font-size:.72rem}

/* Conquistas */
.lvl-card{display:flex;gap:14px;align-items:center}
.lvl-badge{width:68px;height:68px;border-radius:20px;background:var(--manga);color:#3D2800;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.8rem;flex:none}
.lvl-card .c{flex:1;min-width:0}
.lvl-card .bar{margin:6px 0 4px}
.lvl-card .bar i{background:var(--manga)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:14px;background:var(--surface-2)}
.badge .ic{font-size:1.7rem}
.badge b{font-size:.78rem;line-height:1.2}
.badge small{font-size:.68rem;color:var(--muted);line-height:1.25}
.badge.off{opacity:.5}
.badge.off .ic{filter:grayscale(1)}
.badge.got{background:var(--manga-soft)}
.reward{padding:12px 0;border-top:1px solid var(--line)}

.plate{width:100%;max-width:300px;height:auto;display:block;margin:6px auto}

.guide-list{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding-left:18px}
.src{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;padding-left:18px;margin:6px 0 0}
.disclaimer{font-size:.82rem;color:var(--muted);text-align:center;padding:4px 8px}

.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.hdr-av{width:36px;height:48px;flex:none}
.mt small{display:block;font-weight:500;font-size:.74rem;color:var(--muted)}
.chest-banner,.chest{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-color:var(--manga);background:linear-gradient(120deg,var(--manga-soft),var(--surface) 75%)}
.chest-ic{font-size:2rem;line-height:1}
.chest .chest-ic{animation:wiggle 1.6s ease-in-out infinite}

.bottles{display:flex;gap:10px;align-items:flex-end}
.bottle{position:relative;width:44px;height:92px;flex:none}
.bottle svg{position:absolute;inset:0;width:100%;height:100%}
.bottle .glass{fill:none;stroke:#5AA9E6;stroke-width:2}
.bw{position:absolute;left:9px;right:9px;bottom:3px;max-height:76%;background:#5AA9E6;opacity:.85;border-radius:0 0 4px 4px;transition:height .4s}
.ex-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}

.meal.skipped{opacity:.6;border-style:dashed}
.meal.skipped .meal-dot{border-style:solid;color:var(--muted);font-weight:800}
.skip-btn{margin-top:6px}
.req-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.req{border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.req.ok{border-color:var(--couve);background:var(--couve-soft)}
.req-h{display:flex;align-items:center;gap:10px}
.req-h b{flex:1}
.req .check{width:24px;height:24px}

.total-bar{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);text-align:center}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opt{text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font-weight:600}

.calc-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.calc-row div{min-width:0}
.calc-row small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.calc-row .num{white-space:nowrap;font-size:.95rem;font-weight:500;color:var(--couve)}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll button{flex:none;padding:8px 12px}
.empty{text-align:center}
/* Horta */
.res-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.res{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 2px;font-size:1.05rem}
.res b{font-size:.95rem}
.res small{font-size:.66rem;color:var(--muted)}
.scene-card{border-radius:18px;overflow:hidden;border:3px solid #3D2A1E;background:#3D2A1E;box-shadow:var(--shadow)}
.scene-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 10px;background:#3D2A1E;color:#F7E9C8}
.scene-top .hint{color:#D9C49A}
.scene-wrap{position:relative;line-height:0}
#scene{width:100%;height:auto;display:block}
.hot{position:absolute;border-radius:6px}
.hot:hover,.hot:focus-visible{background:rgba(255,255,255,.18);outline:2px dashed #FFF6C2;outline-offset:0}
.hot.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,246,194,0)}50%{box-shadow:inset 0 0 0 3px rgba(255,246,194,.7)}}
.game-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.game-btns .btn.primary{grid-column:1/-1}
.seed-grid,.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.seed,.shop-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 8px}
.seed:hover{border-color:var(--couve)}
.seed canvas,.shop-item canvas,.alb canvas,.plot-info canvas{width:64px;height:64px;background:var(--surface-2);border-radius:10px}
.shop-item canvas[data-decor],.alb canvas[data-decor]{width:96px;height:72px}
.shop-item canvas[data-av],.alb canvas[data-av]{width:48px;height:64px}
.seed small,.shop-item small{color:var(--muted);font-size:.74rem}
.shop-item.own{background:var(--couve-soft);border-color:var(--couve)}
.plot-info{display:flex;align-items:center;gap:12px;margin:8px 0 12px}
.stages{display:flex;gap:6px;margin-bottom:12px}
.stages span{flex:1;height:8px;border-radius:99px;background:var(--surface-2)}
.stages span.on{background:var(--couve)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.alb{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 4px;border-radius:12px;background:var(--surface-2)}
.alb small{font-size:.7rem;color:var(--muted);line-height:1.2}
.alb .q{width:64px;height:64px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--muted);border:2px dashed var(--line);border-radius:10px}
.alb.got{background:var(--manga-soft)}
.av-stage{display:flex;justify-content:center;background:linear-gradient(var(--couve-soft),var(--surface-2));border-radius:16px;padding:12px}
.av-big{width:144px;height:192px}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.av-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.av-tile canvas{width:48px;height:64px}
.av-tile small{font-size:.72rem;font-weight:600;line-height:1.2;text-align:center}
.av-tile.on{border-color:var(--couve);background:var(--couve-soft)}
.av-tile.locked{opacity:.6}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw-c{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);box-shadow:inset 0 0 0 2px var(--surface)}
.sw-c.on{border-color:var(--fg);transform:scale(1.08)}
/* ===== v3 ===== */
.close-banner{border-color:var(--couve);background:linear-gradient(120deg,var(--couve-soft),var(--surface) 75%)}
.pets{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pet{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:var(--surface-2)}
.pet canvas{width:78px;height:66px;flex:none;background:linear-gradient(var(--couve-soft),var(--surface-2));border-radius:10px}
.pet.locked canvas,.pet canvas.shadow{filter:brightness(0) opacity(.35)}
.pet.ready canvas.shadow{filter:none}
.pet.ready{background:var(--manga-soft);animation:ready 1.2s ease-in-out infinite}
.pet-c{flex:1;min-width:0}
.pet-c small{display:block;color:var(--muted);font-size:.8rem}
#pen{width:100%;height:auto;display:block}
.animals{display:flex;flex-direction:column}
.animal{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.animal:first-child{border-top:0}
.animal.locked{opacity:.55}
.an-ic{font-size:1.5rem;width:32px;text-align:center;flex:none}
.an-c{flex:1;min-width:0}
.an-c small{display:block;color:var(--muted);font-size:.8rem}
.hearts{color:var(--goiaba);letter-spacing:1px;font-size:.85rem}
textarea.report{min-height:280px;font-size:.72rem;line-height:1.4}
label.btn input[type=file]{display:none}
/* ===== v4 ===== */
.backup-banner{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-color:var(--goiaba);background:linear-gradient(120deg,var(--goiaba-soft),var(--surface) 75%)}
.steps-form{align-items:flex-end;margin-top:12px}
.star{font-size:1.1rem;color:var(--muted)}
.star.on{color:var(--manga)}
.hunger{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0}
.hunger span{font-weight:600;font-size:.88rem}
.hunger small{grid-column:1/-1;color:var(--muted);font-size:.72rem}
.hscale{display:flex;gap:4px}
.hscale button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
.hscale button.on{background:var(--couve);color:var(--on-couve);border-color:var(--couve)}
.combo.planned{border-color:var(--couve);background:var(--couve-soft);margin-top:10px}
.plan-day.today{border-color:var(--couve)}
.plan-slot{display:flex;gap:10px;width:100%;text-align:left;padding:8px 2px;border-top:1px dashed var(--line);align-items:baseline}
.plan-slot:first-of-type{border-top:0}
.ps-n{width:96px;flex:none;font-size:.8rem;font-weight:700;color:var(--muted)}
.ps-v{flex:1;min-width:0;color:var(--couve);font-weight:600}
.plan-slot.set .ps-v{color:var(--fg)}
.plan-opt{display:block;margin-bottom:6px}
.plan-opt small{display:block;color:var(--muted);font-size:.78rem;font-weight:500;margin-top:2px}
.mk-ed{width:24px;height:24px;display:grid;place-items:center;color:var(--muted);flex:none}
.check-line{display:flex;gap:8px;align-items:center;font-size:.88rem}
.weather{text-align:center;font-size:.88rem;font-weight:600;color:var(--muted)}
.game-btns{grid-template-columns:1fr 1fr 1fr}
.recipe-g{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.recipe-g:not(.ok){opacity:.65}
.fishbar{position:relative;height:34px;border-radius:12px;background:linear-gradient(#6FB6E6,#3E8CC4);margin:14px 0;overflow:hidden}
.fishbar .zone{position:absolute;top:0;bottom:0;background:rgba(95,190,110,.75)}
.fishbar .zone.mid{background:rgba(245,200,66,.9)}
.fishbar .bob{position:absolute;top:5px;width:14px;height:24px;margin-left:-7px;border-radius:7px 7px 4px 4px;background:linear-gradient(#E5483A 50%,#FFFFFF 50%);box-shadow:0 0 0 2px #2A1E1B}
.fish-res{text-align:center;font-weight:800;font-family:var(--f-display);margin-bottom:10px}
.letter{background:var(--manga-soft);border-radius:14px;padding:12px 14px;margin-top:12px}
.letter p{margin-top:6px;font-size:.92rem;line-height:1.5}

.onb-dots{display:flex;gap:6px;justify-content:center}
.onb-dots i{width:28px;height:6px;border-radius:9px;background:var(--line)}
.onb-dots i.on{background:var(--couve)}
.onb-scene{width:100%;height:auto;border-radius:16px;border:3px solid #3D2A1E}
.onb-t{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.onb-p{color:var(--muted)}
.onb-meta{background:var(--couve-soft);border-radius:14px;padding:12px;margin:12px 0;text-align:center}
.onb-done{display:flex;justify-content:center;background:linear-gradient(var(--couve-soft),var(--surface-2));border-radius:16px;padding:16px}
.onb-back{align-self:center}
.onb-restore summary{color:var(--muted)}

.meas-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}

.meas-fig{width:44px;flex:none}
.mfig{width:44px;height:auto;display:block}
.meas-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}

.opt-tag{font-weight:500;color:var(--muted)}

.cartoon .limb{stroke:var(--couve)}
.cartoon .shoe{fill:var(--couve)}
.cartoon .head{stroke:var(--couve);stroke-width:2.5}

.mfig .cartoon .limb{stroke:var(--muted)}
.mfig .cartoon .shoe{fill:var(--muted)}
.mfig .cartoon .head{fill:var(--surface-2);stroke:var(--muted);stroke-width:3}
.mfig .tape{stroke:var(--goiaba);stroke-width:7;stroke-linecap:round}
.mfig .scale{fill:var(--goiaba)}
.sil .tape{stroke:var(--goiaba);stroke-width:3;stroke-dasharray:4 3}
.sil .start{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:3 4}
.sil .goal{fill:none;stroke:var(--manga);stroke-width:2.2;stroke-dasharray:7 5}

.pm{width:100%;max-width:380px;height:auto;display:block;margin:0 auto;shape-rendering:crispEdges}
.pm text{shape-rendering:auto}
.pm .pm-l{font:700 11px var(--f-body);fill:var(--fg)}
.pm .pm-v{font:600 11px var(--f-body)}
.pm .pm-s{font:500 10px var(--f-body);fill:var(--muted)}
.evo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evo-card{display:grid;grid-template-columns:1fr;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.evo-card.open{border-color:var(--couve)}
.evo-l{font-size:.8rem;font-weight:600;color:var(--muted)}
.evo-v{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.evo-v small{font-family:var(--f-body);font-size:.8rem;font-weight:600;color:var(--muted)}
.evo-d{justify-self:start;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--couve-soft);color:var(--ok)}
.evo-d.up{background:var(--manga-soft);color:var(--warn)}
.evo-d.none{background:var(--surface-2);color:var(--muted)}
.evo-sp{width:100%;height:36px;margin-top:6px}
.evo-p{display:block;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.evo-p i{display:block;height:100%;background:var(--manga);border-radius:9px}
.evo-ps{font-size:.7rem;color:var(--muted)}
.evo-chart{grid-column:1/-1;background:var(--surface);border:1px solid var(--couve);border-radius:16px;padding:10px}
.pixfig{shape-rendering:crispEdges}
.meas-fig{width:40px}
.mfig.pixfig{width:40px}

function renderSheet(toTop){

}

const macroLine = it => `${nf0.format(sumK(it))} kcal · ${nf0.format(sumP(it))} g prot. · ${nf1.format(sumFb(it))} g fibra`;

function imcStatus(v){ return v < 18.5 ? ['warn','Abaixo do adequado'] : v < 25 ? ['ok','Adequado'] : v < 30 ? ['warn','Sobrepeso'] : ['bad','Obesidade']; }
function cinturaStatus(v){ return v < 80 ? ['ok','Faixa saudável'] : v < 88 ? ['warn','Risco aumentado'] : ['bad','Risco alto']; }
function rceStatus(v){ return v < 0.5 ? ['ok','Faixa saudável'] : v < 0.6 ? ['warn','Atenção'] : ['bad','Risco alto']; }
function lineChart(key, unit, color, goal){
  const pts = sortedMeasures().filter(m => m[key]).map(m => ({d:m.date, v:m[key]}));
  if (pts.length < 2) return `<p class="hint">A linha aparece a partir da segunda medição.</p>`;
  const W = 320, H = 150, pl = 34, pr = 10, pt = 12, pb = 24;
  let mn = Math.min.apply(null, pts.map(p => p.v)), mx = Math.max.apply(null, pts.map(p => p.v));
  if (goal != null) mn = Math.min(mn, goal);
  const pad = Math.max(0.5, (mx-mn)*0.15); mn = Math.floor(mn-pad); mx = Math.ceil(mx+pad);
  const t0 = dayNum(pts[0].d), t1 = dayNum(pts[pts.length-1].d);
  const X = d => pl + (t1===t0 ? 0 : (dayNum(d)-t0)/(t1-t0))*(W-pl-pr);
  const Y = v => pt + (1-(v-mn)/(mx-mn))*(H-pt-pb);
  const ticks = [mn, (mn+mx)/2, mx];
  const line = pts.map((p,i) => (i?'L':'M')+X(p.d).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
  const area = line + ` L${X(pts[pts.length-1].d).toFixed(1)},${H-pb} L${X(pts[0].d).toFixed(1)},${H-pb}Z`;
  const last = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de ${key}: de ${nf1.format(pts[0].v)} para ${nf1.format(last.v)} ${unit}">
    ${ticks.map(v => `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${pl-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${nf1.format(v)}</text>`).join('')}
    ${goal != null && goal >= mn && goal <= mx ? `<line class="goal" x1="${pl}" x2="${W-pr}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}"/>` : ''}
    <path class="area" d="${area}" fill="${color}"/><path class="ln" d="${line}" stroke="${color}"/>
    ${pts.map(p => `<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="${color}"/>`).join('')}
    <circle cx="${X(last.d).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="5.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${H-6}">${fmtD(pts[0].d)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtD(last.d)}</text></svg>`;
}
function viewCorpo(){
  const st = stats(); const lc = latestOf('cintura'), lp = latestOf('peso'), alt = S.profile.altura, p = S.profile;
  const imc = lp && alt ? lp/Math.pow(alt/100,2) : null, rce = lc && alt ? lc/alt : null;
  const ms = sortedMeasures(); const next = addDays(ms.length ? ms[ms.length-1].date : today(), 7);
  const stat = (lbl, v, unit, status, delta) => `<div class="stat"><div class="l">${lbl}</div><div class="v">${v}<small>${unit}</small></div>${status?`<span class="status ${status[0]}">${status[1]}</span>`:''}${delta||''}</div>`;
  const dl = (v,u) => v > 0 ? `<div class="delta">−${nf1.format(v)} ${u} desde o início</div>` : v < 0 ? `<div class="delta up">+${nf1.format(-v)} ${u} desde o início</div>` : '';

function calcValues(){
  const num = (id, def) => { const el = $(id); if (!el) return def; const v = parseFloat(String(el.value).replace(',','.')); return isFinite(v) && v > 0 ? v : def; };
  const peso = num('#c-peso', 67), alt = num('#c-alt', 162), idade = num('#c-idade', 30), def = num('#c-def', 0) || 0, ativ = num('#c-ativ', 1.375);
  const b = bmr(peso, alt, idade); const get = b.mifflin*ativ; const meta = Math.max(1200, Math.round((get - def)/10)*10);
  const realDef = get - meta; const perda = realDef*7/7700;
  const protLo = Math.round(peso*1.2), protHi = Math.round(peso*1.6);
  const gordLo = Math.round(meta*0.25/9), gordHi = Math.round(meta*0.30/9);
  const carb = Math.round((meta - protLo*4 - meta*0.275)/4);
  return {peso, alt, idade, def, ativ, b, get, meta, perda, protLo, protHi, gordLo, gordHi, carb, agua:Math.round(peso*35/100)*100};
}
function renderCalc(){

  el.innerHTML = row('Metabolismo basal', `${nf0.format(c.b.mifflin)} kcal`, `Gasto em repouso total, pela fórmula de Mifflin-St Jeor. A de Harris-Benedict dá ${nf0.format(c.b.harris)} kcal; a verdade costuma estar nessa faixa.`) +

// ===================== fechamento da semana =====================
function weekSummary(wk){
  const days = []; for (let i=0;i<7;i++){ const k = addDays(wk,i); if (k > today()) break; days.push(k); }
  let active = 0, perfect = 0, meals = 0, kc = [], pr = [], fb = [], wa = [], exm = 0, exd = 0, skips = 0;
  days.forEach(k => { const d = S.days[k]; if (!d) return; const md = missionsDone(d,k); if (md >= 2) active++; if (md >= 3) perfect++;
    const it = dayItems(d); const ml = Object.keys(d.meals||{}).filter(s => d.meals[s] && d.meals[s].length).length; meals += ml; skips += Object.keys(d.skip||{}).length;
    if (ml >= 2){ kc.push(sumK(it)); pr.push(sumP(it)); fb.push(sumFb(it)); }
    if (d.water) wa.push(d.water); const m = exMin(d); exm += m; if (m >= 10) exd++; });
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0)/a.length : null;
  const ms = sortedMeasures().filter(m => m.date >= wk && m.date <= addDays(wk,6));
  return {wk, days:days.length, active, perfect, meals, skips, kcal:avg(kc), prot:avg(pr), fib:avg(fb), agua:avg(wa), exm, exd, ms};
}
function closeWeekAvailable(){
  const t = today(), dow = toDate(t).getDay();
  if (dow === 0){ const wk = weekKey(t); if (!S.closed[wk]) return wk; }
  if (dow >= 1 && dow <= 3){ const prev = weekKey(addDays(t,-7)); if (!S.closed[prev] && addDays(prev,6) >= S.start){ const ws = weekSummary(prev); if (ws.meals + ws.active > 0) return prev; } }
  return null;
}
function sheetClose(){
  const wk = ctx.closeWk, w = weekSummary(wk), pw = weekSummary(addDays(wk,-7)), claimed = S.closed[wk];
  const cmp = (a, b, unit, better) => { if (a == null) return '–'; const txt = nf0.format(a) + unit; if (b == null) return txt; const diff = a - b; if (Math.abs(diff) < 1) return txt; const good = better === 'up' ? diff > 0 : diff < 0; return txt + ` <span class="delta ${good?'':'up'}">${diff>0?'+':'−'}${nf0.format(Math.abs(diff))}</span>`; };
  const row = (l, v) => `<div class="calc-row"><div><b>${l}</b></div><span class="num">${v}</span></div>`;
  let h = sheetHead('Fechamento da semana') + `<p class="hint">${esc(fmtD(wk,{day:'2-digit',month:'long'}))} a ${esc(fmtD(addDays(wk,6),{day:'2-digit',month:'long'}))}</p>`;
  h += row('Dias ativos', `${w.active} de ${w.days}`) + row('Dias perfeitos', w.perfect) + row('Refeições anotadas', w.meals) +
    row('Média de energia', cmp(w.kcal, pw.kcal, ' kcal', 'none')) + row('Média de proteína', cmp(w.prot, pw.prot, ' g', 'up')) + row('Média de fibra', cmp(w.fib, pw.fib, ' g', 'up')) +
    row('Água por dia', w.agua ? fmtL(Math.round(w.agua/100)*100) : '–') + row('Exercício', `${w.exm} min em ${w.exd} ${w.exd===1?'dia':'dias'}`);
  if (w.ms.length) { const l = w.ms[w.ms.length-1]; h += row('Medida da semana', [l.peso?nf1.format(l.peso)+' kg':null, l.cintura?nf1.format(l.cintura)+' cm de cintura':null].filter(Boolean).join(' · ')); }
  h += `<div class="letter"><b>Cartinha do Beto e do Floki</b><p>${esc(petLetter(w))}</p></div>`;
  h += claimed ? `<p class="perfect-msg" style="text-align:center">Baú da semana aberto: +${claimed.coins} 🪙${claimed.extra?' e '+esc(claimed.extra):''}</p>` : `<button class="btn primary wide" data-a="closeclaim" style="margin-top:14px">Abrir baú da semana 🎁</button>`;
  h += `<div class="sub-h">Próximos passos</div><div class="row-btns" style="margin-top:0"><button class="btn ghost sm" data-a="wmisnext">Escolher missões da próxima semana</button><button class="btn ghost sm" data-a="report" data-v="claude">Relatório para o Claude</button><button class="btn ghost sm" data-a="settings">Fazer backup</button></div>`;
  return h;

function reportRange(n){ const t = today(); const ks = []; for (let i=n-1;i>=0;i--){ const k = addDays(t,-i); if (k >= S.start) ks.push(k); } return ks; }
function reportNutri(n){
  const ks = reportRange(n), t = targets(), ms = sortedMeasures();
  const logged = ks.map(k => S.days[k]).filter(d => d && Object.keys(d.meals||{}).filter(s => d.meals[s] && d.meals[s].length).length >= 2);
  const avg = f => logged.length ? logged.reduce((a,d) => a + f(d), 0) / logged.length : null;
  const freq = {}; ks.forEach(k => { const d = S.days[k]; if (!d) return; dayItems(d).forEach(x => { freq[x.id] = (freq[x.id]||0) + 1; }); });
  const top = Object.keys(freq).sort((a,b) => freq[b]-freq[a]).slice(0,10).map(id => fOf(id).n.toLowerCase() + ' (' + freq[id] + 'x)');
  let exm = 0, exd = 0, types = {}; ks.forEach(k => { const d = S.days[k]; if (!d) return; const m = exMin(d); exm += m; if (m >= 10) exd++; (d.ex||[]).forEach(e => types[exName(e.t)] = (types[exName(e.t)]||0) + e.min); });
  const skips = {}; ks.forEach(k => { const d = S.days[k]; if (d && d.skip) Object.keys(d.skip).forEach(s => skips[SLOT[s].n] = (skips[SLOT[s].n]||0)+1); });
  const L = [];
  L.push('Resumo alimentar — ' + (S.profile.nome || 'paciente'));
  L.push(`Período: ${fmtD(ks[0])} a ${fmtD(ks[ks.length-1])} (${ks.length} dias, ${logged.length} com registro completo)`);
  L.push('');
  L.push('Medidas:');
  const inR = ms.filter(m => m.date >= addDays(today(), -n-7));
  (inR.length ? inR : ms.slice(-2)).forEach(m => L.push(`  ${fmtD(m.date)}: ${[m.peso?nf1.format(m.peso)+' kg':null, m.cintura?'cintura '+nf1.format(m.cintura)+' cm':null, m.quadril?'quadril '+nf1.format(m.quadril)+' cm':null, m.braco?'braço '+nf1.format(m.braco)+' cm':null].filter(Boolean).join(', ')}`));
  L.push(`  Altura: ${S.profile.altura} cm`);
  L.push('');
  L.push('Médias por dia (dias com registro):');
  L.push(`  Energia: ${avg(d => sumK(dayItems(d))) != null ? nf0.format(avg(d => sumK(dayItems(d)))) : '–'} kcal (meta usada no app: ${nf0.format(t.kcal)} kcal)`);
  L.push(`  Proteína: ${avg(d => sumP(dayItems(d))) != null ? nf0.format(avg(d => sumP(dayItems(d)))) : '–'} g · Fibra: ${avg(d => sumFb(dayItems(d))) != null ? nf0.format(avg(d => sumFb(dayItems(d)))) : '–'} g`);
  const wd = ks.map(k => S.days[k]).filter(d => d && d.water); L.push(`  Água: ${wd.length ? fmtL(Math.round(wd.reduce((a,d)=>a+d.water,0)/wd.length/100)*100) : '–'}`);
  L.push(`  Leite de casa: ${(MILK[S.profile.leite]||MILK.isl).n.toLowerCase()}`);
  L.push('');
  L.push(`Exercício: ${exm} min em ${exd} dias` + (Object.keys(types).length ? ' (' + Object.keys(types).map(k => k.toLowerCase() + ' ' + types[k] + ' min').join(', ') + ')' : ''));
  if (Object.keys(skips).length) L.push('Refeições puladas: ' + Object.keys(skips).map(k => k.toLowerCase() + ' ' + skips[k] + 'x').join(', '));
  if (top.length) L.push('Alimentos mais frequentes: ' + top.join(', '));
  if (S.wins.length) L.push('Vitórias percebidas: ' + S.wins.slice(-5).map(w => w.text.toLowerCase()).join('; '));
  L.push('');
  L.push('Registro feito pelo app Prato Leve (valores aproximados pela tabela TACO).');
  return L.join('\n');
}

function normalizeMeasure(k, raw){

function makeGift(){
  const r = hash(weekKey(today()) + 'gift') % 100, G = S.game;
  const paid = ACCS.filter(a => a.preco > 0 && !a.evento && !G.wardrobe[a.id]);
  if (r < 35 && paid.length){ const a = paid[r % paid.length]; return {k:'acc', id:a.id, txt:a.n}; }
  if (r < 65){ const sp = r % 2 ? 'rosa' : 'ipe'; return {k:'seed', id:sp, txt:'semente rara de ' + SP[sp].n.toLowerCase()}; }
  return {k:'coins', n:30, txt:'30 moedas'};
}

// ---------- cartinha ----------
function petLetter(w){
  const parts = [];
  parts.push(w.active >= 5 ? `Oi! Aqui é o Beto. Você cuidou de você ${w.active} dias essa semana e eu fiquei abanando o rabo o tempo todo.` : w.active >= 2 ? `Oi! Aqui é o Beto. Foram ${w.active} dias firmes essa semana. Semana que vem a gente caminha mais junto?` : `Oi! Aqui é o Beto. A semana foi corrida, né? Tudo bem. Amanhã é dia de recomeçar e eu tô aqui.`);
  if (w.prot != null) parts.push(w.prot >= targets().prot ? 'O Floki mandou dizer que a proteína tá em dia e que ele aprova.' : `O Floki notou que a proteína ficou em ${nf0.format(w.prot)} g por dia. Ele sugere um ovo a mais no café.`);
  if (w.exm >= 150) parts.push(`E ${w.exm} minutos de exercício! Isso é coisa de campeã.`);
  else if (w.exm > 0) parts.push(`Você se mexeu ${w.exm} minutos. Bora chegar nos 150?`);
  if (w.perfect) parts.push(`${w.perfect} ${w.perfect===1?'dia perfeito':'dias perfeitos'}! A horta tá brilhando.`);
  parts.push('Lambeijos e ronronados, Beto e Floki.');
  return parts.join(' ');
}

// ===================== efeitos =====================
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){
  if (reduceMotion()) return; const c = $('#confetti'); if (!c || !c.getContext) return; const g = c.getContext('2d'); if (!g) return;
  const W = c.width = innerWidth, H = c.height = innerHeight; const cols = ['#1C7247','#DF9300','#D2445F','#5AA9E6','#F5C842'];
  const ps = Array.from({length:90}, () => ({x:W/2+(Math.random()-.5)*80, y:H*0.55, vx:(Math.random()-.5)*11, vy:-Math.random()*14-6, s:Math.random()*5+4, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function frame(now){ const el = now-t0; g.clearRect(0,0,W,H);
    ps.forEach(p => { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; g.globalAlpha = Math.max(0, 1-el/1800); g.fillStyle = p.c; g.fillRect(Math.round(p.x/3)*3, Math.round(p.y/3)*3, p.s, p.s); });
    if (el < 1800) requestAnimationFrame(frame); else g.clearRect(0,0,W,H);
  })(t0);
}
function checkBadges(){
  const st = stats(); const fresh = [];
  ALL_BADGES.forEach(b => { if (!S.badges[b.id] && b.ok(st)){ S.badges[b.id] = today(); fresh.push(b); } });
  const lv = level(st.xp).i;
  if (fresh.length){ toast(`Medalha nova: ${fresh[0].ic} ${fresh[0].n} (+10 🪙)` + (fresh.length>1 ? ` e mais ${fresh.length-1}` : '')); confetti(); }
  else if (lv > (S.lastLevel||0)){ toast(`Subiu para o nível ${lv+1}: ${LEVELS[lv][1]}!`); confetti(); }
  S.lastLevel = Math.max(S.lastLevel||0, lv);
  S.game.petSeen = S.game.petSeen || {};
  petInfo().forEach(o => { if (o.ready && !S.game.petSeen[o.p.id]){ S.game.petSeen[o.p.id] = today(); toast(`${o.p.n} quer morar na sua horta! Veja na aba Horta.`); confetti(); } });
}

  avopen(){ openSheet(sheetAvatar); },
  avwho(el){ avWho = el.dataset.v; if (!S.onboarded) renderOnb(); renderSheet(); },
  avtab(el){ avTab = el.dataset.v; if (!S.onboarded) renderOnb(); renderSheet(); },
  avset(el){ const p = el.dataset.p; let v = el.dataset.v; if (p === 'skin' || p === 'hc') v = +v; S.game[avWho][p] = v; changed(); },
  avacc(el){ const cfg = S.game[avWho], id = el.dataset.v; cfg.acc = cfg.acc || []; const i = cfg.acc.indexOf(id);
    if (i >= 0) cfg.acc.splice(i,1); else { const heads = ['chapeu','bone','lenco','coroa']; if (heads.indexOf(id) >= 0) cfg.acc = cfg.acc.filter(a => heads.indexOf(a) < 0); cfg.acc.push(id); }
    changed(); },
};
function keepDraft(){ ctx.measDraft = ctx.measDraft || {}; document.querySelectorAll('[data-mk],[data-dr]').forEach(el => { ctx.measDraft[el.id] = el.value; if (!S.onboarded){ onbData.draft = onbData.draft || {}; onbData.draft[el.id] = el.value; } }); }
function syncBuildName(){ const el = $('#b-nome'); if (el && ctx.build) ctx.build.n = el.value; }
const FORMS = {
  mkadd(){ const v = $('#mk-new').value.trim(); if (!v) return; if (S.market.custom.indexOf(v) < 0) S.market.custom.push(v.slice(0,60)); changed(); },
  win(){ const v = $('#win-new').value.trim(); if (!v) return; S.wins.push({date:today(), text:v.slice(0,120)}); changed(); toast('Vitória anotada! +3 🪙'); },
  meas(){
    let date = $('#m-date').value || today(); if (date > today()) date = today();
    const r = collectMeasures('m-'); const warn = $('#meas-warn');
    if (r.errs.length){ if (warn) warn.innerHTML = `<p class="meas-alert">${r.errs.map(esc).join('<br>')}</p>`; return; }
    if (!Object.keys(r.m).length){ toast('Preencha pelo menos uma medida.'); return; }
    const jumps = bigJumps(r.m, date);
    if (jumps.length && ctx.measConfirm !== JSON.stringify(r.m)){ ctx.measConfirm = JSON.stringify(r.m); if (warn) warn.innerHTML = `<p class="meas-alert">Mudou bastante desde a última vez:<br>${jumps.map(esc).join('<br>')}<br>Confira a fita ou a balança. Se estiver certo, toque em Salvar de novo.</p>`; return; }
    ctx.measConfirm = null; ctx.measDraft = {};
    const i = S.measures.findIndex(x => x.date === date);
    if (i >= 0) S.measures[i] = Object.assign({}, S.measures[i], r.m, {date}); else S.measures.push(Object.assign({date}, r.m));
    changed(); toast((r.notes.length ? 'Corrigi: ' + r.notes.join('; ') + '. ' : '') + 'Medidas salvas! +5 🪙');
  },
  rw(){ const t = $('#rw-text').value.trim(), g = parseFloat($('#rw-goal').value), ty = $('#rw-type').value; if (!t || !(g > 0)){ toast('Escreva o prêmio e quantos precisa.'); return; } S.rewards.push({id:'r'+Date.now(), text:t.slice(0,60), type:ty, goal:g, claimed:null}); changed(); toast('Prêmio no cofrinho!'); },
  fe(){
    const num = id => { const v = parseFloat(String($(id).value).replace(',','.')); return isFinite(v) && v >= 0 ? Math.round(v*10)/10 : null; };
    const o = {n:$('#fe-n').value.trim().slice(0,50), g:$('#fe-g').value, p:$('#fe-p').value.trim().slice(0,50) || '1 porção', e:($('#fe-e').value.trim() || GROUP_ICON[$('#fe-g').value] || '🍴').slice(0,4), k:num('#fe-k'), pr:num('#fe-pr') || 0, fb:num('#fe-fb') || 0};
    if (!o.n){ toast('Dê um nome ao alimento.'); return; }
    if (o.k == null || o.k > 3000){ toast('Informe as calorias da porção (até 3000).'); return; }
    const id = ctx.fe.id;
    if (!id){ const nid = 'u'+Date.now(); S.customFoods.push(Object.assign({id:nid}, o)); ctx.fe.id = nid; }
    else if (F[id] && F[id].custom){ const i = S.customFoods.findIndex(x => x.id === id); S.customFoods[i] = Object.assign({id}, o); }
    else S.foodEdits[id] = o;
    rebuildFoods(); const newId = ctx.fe.id; popSheet();
    const top = stack[stack.length-1];
    if (top === sheetPick && !id){ ctx.pick.q = ''; const fake = {dataset:{id:newId}}; A.pick(fake); toast(`${o.n} cadastrado e adicionado`); return; }
    changed(); toast(id ? 'Alimento atualizado' : `${o.n} cadastrado`);
  },
  ex(){ const min = parseInt($('#ex-min').value,10), kc = $('#ex-kcal').value.trim();
    if (!(min > 0 && min <= 600)){ toast('Informe os minutos do exercício.'); return; }
    const k = kc === '' ? null : clamp(parseInt(kc,10) || 0, 0, 3000);
    const d = getDay(viewDate), before = missionsDone(d, viewDate); d.ex.push({t:ctx.ex.t, min, kcal:k, int:ctx.ex.int || 'moderada'});
    toast(`Exercício anotado! +${Math.min(6, Math.floor(min/10))} ⚡`); perfectCheck(before, viewDate); changed(); },
  extype(){ const n = $('#et-n').value.trim(); if (!n){ toast('Dê um nome ao treino.'); return; } const t = {id:'et'+Date.now(), n:n.slice(0,40), met:parseFloat($('#et-met').value)||5}; S.exTypes.push(t); ctx.ex.t = t.id; changed(); toast(`${t.n} criado`); },
  rename(){ const st = S.game.animals[ctx.animal]; if (!st) return; st.nome = $('#an-n').value.trim().slice(0,20); closeSheet(); changed(); },
  steps(){ const v = parseInt($('#st-n').value,10); const d = getDay(viewDate), before = missionsDone(d, viewDate); d.steps = isFinite(v) && v >= 0 ? Math.min(v, 100000) : 0; perfectCheck(before, viewDate); changed(); toast(d.steps >= (S.profile.passos||7000) ? 'Meta de passos batida! 👟' : `${nf0.format(d.steps)} passos anotados`); },
  mkitem(){ const {si, ii} = ctx.mk; const n = $('#mi-n').value.trim(); const q = parseFloat(String($('#mi-q').value).replace(',','.')); if (!n || !(q > 0)){ toast('Preencha nome e quantidade.'); return; }
    const it = {id: ii >= 0 ? S.market.list[si].items[ii].id : 'mk' + Date.now(), n:n.slice(0,60), q, u:($('#mi-u').value.trim() || 'unid.').slice(0,30), scale:$('#mi-scale').checked};
    if (ii >= 0 && /^leite /i.test(n) && S.market.list[si].items[ii].n === '@leite' && n === 'Leite ' + (MILK[S.profile.leite]||MILK.isl).n.toLowerCase()) it.n = '@leite';
    const to = +$('#mi-s').value; if (ii >= 0) S.market.list[si].items.splice(ii,1); S.market.list[to].items.splice(ii >= 0 && to === si ? ii : S.market.list[to].items.length, 0, it); closeSheet(); changed(); },
  mksec(){ const n = $('#ms-n').value.trim(); if (!n) return; if (ctx.mkSec != null) S.market.list[ctx.mkSec].s = n.slice(0,40); else S.market.list.push({s:n.slice(0,40), items:[]}); closeSheet(); changed(); },
  note(){ const v = $('#note-new').value.trim(); if (!v) return; S.himNotes.push(v.slice(0,120)); changed(); toast('Recado guardado'); },
  onbmed(){
    const idade = parseInt(String($('#ob-idade').value).replace(/\D/g,''),10), alt = normalizeAltura($('#ob-alt').value);
    const r = collectMeasures('ob-'); const warn = $('#meas-warn'); const errs = r.errs.slice();
    if (!(idade >= 15 && idade <= 90)) errs.unshift('Idade: coloque em anos.');
    if (alt.err || alt.v == null) errs.unshift(alt.err || 'Altura: coloque em centímetros.');
    if (r.m.peso == null) errs.push('Peso é obrigatório.'); if (r.m.cintura == null) errs.push('Cintura é obrigatória.');
    if (errs.length){ if (warn) warn.innerHTML = `<p class="meas-alert">${errs.map(esc).join('<br>')}</p>`; return; }
    const p = S.profile; p.nome = $('#ob-nome').value.trim().slice(0,30); p.idade = idade; p.altura = alt.v;
    const m = Object.assign({date:today()}, r.m);
    const i = S.measures.findIndex(x => x.date === today()); if (i >= 0) S.measures[i] = m; else S.measures.push(m);
    save(); const notes = (alt.note ? [alt.note] : []).concat(r.notes); if (notes.length) toast('Corrigi: ' + notes.join('; '));
    A.onbnext(); },
  onbrot(){ const p = S.profile; p.atividade = parseFloat($('#or-ativ').value); p.ritmo = parseInt($('#or-ritmo').value,10); p.leite = $('#or-leite').value; const g = parseInt($('#or-gar').value,10); if (g >= 100 && g <= 3000) p.garrafa = g; save(); A.onbnext(); },
  wk(){ const n = $('#wk-n').value.trim(), u = $('#wk-url').value.trim(); if (!n || !/^https?:\/\//i.test(u)){ toast('Dê um nome e cole o link completo (começando com https).'); return; } S.workouts.push({n:n.slice(0,50), url:u.slice(0,300)}); changed(); },
  wmnew(){ const v = $('#wm-new').value.trim(); if (!v) return; const m = {id:'cm'+Date.now(), t:v.slice(0,60)}; S.customMis.push(m); if (ctx.wm.length < 3) ctx.wm.push(m.id); save(); renderSheet(); },
  cp(){ const v = $('#cp-new').value.trim(); if (!v) return; weekObj(weekKey(today())).couple = v.slice(0,80); closeSheet(); changed(); toast('Desafio da semana trocado'); },
  settings(){
    const p = S.profile; const int = id => { const v = parseInt($(id).value,10); return isFinite(v) ? v : null; };
    p.nome = $('#s-nome').value.trim().slice(0,30);
    const idade = int('#s-idade'); if (idade && idade >= 15 && idade <= 90) p.idade = idade;
    const alt = normalizeAltura($('#s-altura').value); if (alt.v) p.altura = alt.v;
    const gar = int('#s-garrafa'); if (gar && gar >= 100 && gar <= 3000) p.garrafa = gar;
    const ag = int('#s-agua'); p.aguaMl = ag && ag >= 800 && ag <= 6000 ? ag : null;
    p.leite = $('#s-leite').value; p.exBonus = parseFloat($('#s-exb').value); p.autoAtiv = $('#s-auto').checked;
    const kc = int('#s-kcal'); p.kcalManual = kc && kc >= 900 && kc <= 4000 ? kc : null;
    const pr = int('#s-prot'); p.protManual = pr && pr >= 30 && pr <= 250 ? pr : null;
    const ps = int('#s-passos'); if (ps && ps >= 1000 && ps <= 40000) p.passos = ps;
    closeSheet(); changed(); toast('Ajustes salvos');
  },
};

// ===================== eventos =====================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]){ if (el.tagName === 'A') return; A[el.dataset.a](el, e); return; }
  if (e.target.id === 'sheet') closeSheet();
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.f] && FORMS[f.dataset.f](); });
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'pick-q'){ ctx.pick.q = e.target.value; renderPickList(); }
  if (id === 'food-q'){ foodQ = e.target.value; renderFoodList(); }
  if (id && id.indexOf('c-') === 0) renderCalc();
  if (id && id.indexOf('fe-') === 0) feRoles();
  if (id === 'b-nome' && ctx.build) ctx.build.n = e.target.value;
  if (e.target.dataset && (e.target.dataset.mk || e.target.dataset.dr)){ ctx.measDraft = ctx.measDraft || {}; ctx.measDraft[id] = e.target.value; if (!S.onboarded){ onbData.draft = onbData.draft || {}; onbData.draft[id] = e.target.value; } }
  if (id === 'ex-min'){ const el = $('#ex-est'); const m = parseInt(e.target.value,10); if (el && m > 0) el.textContent = `Estimativa sem relógio: cerca de ${estKcal(ctx.ex.t, m, latestOf('peso')||67, ctx.ex.int)} kcal.`; }
});
document.addEventListener('change', e => { if (e.target.id === 'bk-file' && e.target.files && e.target.files[0]){ const fr = new FileReader(); fr.onload = () => { try { const o = JSON.parse(fr.result); if (!o || !o.profile || !o.days) throw 0; S = o; migrate(); S.onboarded = true; rebuildFoods(); changed(); closeSheet(); toast('Dados restaurados do arquivo'); } catch(err){ toast('Arquivo inválido.'); } }; fr.readAsText(e.target.files[0]); return; }
  const id = e.target.id; if (id && id.indexOf('c-') === 0) renderCalc(); if (id === 'fe-g') feRoles(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if ((followToday && viewDate !== today()) || viewDate > today()){ viewDate = today(); render(); } });

const bootEmpty = (() => { try { return !localStorage.getItem(KEY); } catch(e){ return true; } })();
render(); checkBadges(); if (!bootEmpty) save(); startSceneLoop();
if (bootEmpty) idbLoad().then(txt => { if (!txt) { save(); return; } try { const o = JSON.parse(txt); if (o && o.profile && o.days && Object.keys(o.days).length){ S = o; migrate(); rebuildFoods(); save(); render(); toast('Seu progresso foi recuperado da cópia automática.'); } else save(); } catch(e){ save(); } });
window.__pratoLeve = {planShopping, petLetter, weatherOf, eventOf, petGrid, drawPen, weekSummary, reportNutri, reportClaude, closeWeekAvailable, S:() => S, stats, targets, streak, level, res, A, FORMS, render, avatarGrid, ctx};

})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
